<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi-Model Chatbot</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app">
      <section class="chat-shell" aria-label="Multi-model chatbot">
        <header class="topbar">
          <div class="hero-copy">
            <p class="eyebrow">Side-by-side AI replies</p>
            <h1>Multi-Model Chatbot</h1>
            <p class="hero-text">Compare responses from leading models in one clean view.</p>
          </div>
          <button id="clearButton" class="ghost-button" type="button">Clear</button>
        </header>

        <section class="summary-bar" aria-label="Model status summary">
          <span class="pill">Mistral</span>
          <span class="pill">NVIDIA</span>
          <span class="pill">Grok</span>
          <span class="pill accent">Live comparison</span>
        </section>

        <section id="providerGrid" class="provider-grid" aria-live="polite"></section>

        <form id="chatForm" class="composer">
          <label class="sr-only" for="promptInput">Message</label>
          <textarea id="promptInput" rows="3" placeholder="Ask Mistral, NVIDIA, and Grok at once..." required></textarea>
          <button id="sendButton" type="submit">Send</button>
        </form>
      </section>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>

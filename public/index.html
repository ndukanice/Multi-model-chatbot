<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi-Model Chatbot</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Multi-model API chatbot</p>
        <h1>Ask once. <span>Compare every answer.</span></h1>
        <p class="subtitle">One prompt, sent to every model at the same time. See who answers best, and how fast.</p>
      </header>

      <section class="composer" aria-label="Chat prompt">
        <form id="chat-form">
          <label for="prompt">Prompt</label>
          <textarea id="prompt" name="prompt" rows="4" placeholder="Ask the models anything..." required></textarea>
          <div class="actions">
            <button type="submit" id="send-button">Send to all models</button>
            <span id="status" role="status"></span>
            <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to send</span>
          </div>
        </form>
      </section>

      <section class="results-grid" id="results" aria-live="polite"></section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
